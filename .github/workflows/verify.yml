# The package has no build and no lockfile, so there is nothing to compile and
# no install to cache. What it does have is invariants that fail silently in a
# browser -- a font subset that renders slightly wrong, a type ramp that resizes
# a consumer's existing text without an error, a weight token that no utility
# can reach, and a colour role edited past a contrast floor. All are checked here because none is visible in a diff, and a
# green axe run does not see the last one either: axe reads a rendered page, and
# a pair can be broken in this file long before any page puts it on screen.
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  type-ramp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No dependencies: the ramp check reads CSS and TSX as text on purpose,
      # so it cannot be broken by an install failing.
      - run: python3 scripts/verify-type-ramp.py

  weight-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib only, and text-based for the same reason as the ramp check: this
      # package has no lockfile, so a check that needed an install would be a
      # check that does not run.
      - run: python3 scripts/verify-weight-scale.py

  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli
      - run: python3 scripts/verify-fonts.py

  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No dependencies and no browser, for the same reason as the checks above:
      # node is already on the runner, and this package has no lockfile to install
      # from. It builds a throwaway consumer in a temp dir, symlinks the package
      # into its node_modules and imports every public subpath, because the defect
      # it catches -- a `.ts` file in a directory whose exports wildcard says
      # `.tsx` -- is invisible everywhere else: the file exists, the barrel exports
      # it, tsc is happy, and only a consumer sees `Cannot find module`. JH217
      # found it once and it was still open when JH222 found two more of it.
      - run: node scripts/verify-exports.mjs

  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib only -- the WCAG formula is twelve lines, and a dependency here
      # would be a dependency in the one check that must never fail to run.
      - run: python3 scripts/verify-contrast.py --table
